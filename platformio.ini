; PlatformIO Project Configuration File
; Implantable Pump Firmware
;
; Two environments are defined so you can switch boards without touching code:
;   pio run -e esp32dev   (default: classic ESP32 DevKit)
;   pio run -e esp32s3    (ready for when/if you move to S3)
;
; Upload + monitor in one shot:
;   pio run -e esp32dev -t upload -t monitor

[platformio]
default_envs = esp32dev

; ---- Shared settings across all environments ----
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    ; Add shared libraries here, e.g.:
    ; gin66/FastAccelStepper @ ^0.31.2

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_DEVKIT

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3

; ---- Native unit testing (runs on your laptop, not the ESP32) ----
; Lets you test pure control-logic functions (e.g. flow rate math, PID)
; without hardware attached. Put tests in /test.
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = true
build_src_filter =
    +<*>
    -<main.cpp>
    -<drivers/>
build_flags =
    -DUNIT_TEST
