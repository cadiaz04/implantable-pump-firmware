; PlatformIO Project Configuration File
; BioPump Controller — ESP32 pump control + flow calibration
;
; Environments:
;   pio run -e esp32dev          real hardware (default)
;   pio run -e esp32dev_sim      same firmware with simulated pumps + sensor (-DSIM_MODE)
;   pio test -e native           host-side unit tests of the pure-logic modules
;
; Flash firmware + web UI:
;   pio run -e esp32dev -t upload
;   pio run -e esp32dev -t uploadfs      (uploads data/ to LittleFS — erases saved pump profiles!)

[platformio]
default_envs = esp32dev

[esp32_common]
; Platform pinned: 6.12.0 ships Arduino-ESP32 2.0.17 / ESP-IDF 4.4. The step
; generator (src/motors/step_engine.cpp) uses the IDF 4.4 legacy timer-group
; driver, which changes in Arduino core 3.x — re-test before bumping.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv   ; 3 MB app (no OTA) + ~900 KB LittleFS
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
lib_deps =
    esp32async/AsyncTCP @ 3.5.0
    esp32async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DCORE_DEBUG_LEVEL=2
    ; Keep the network stack on core 0; real-time work is pinned to core 1.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DWS_MAX_QUEUED_MESSAGES=16
    -DDEFAULT_MAX_WS_CLIENTS=6

[env:esp32dev]
extends = esp32_common

[env:esp32dev_sim]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DSIM_MODE

; ---- Native unit testing (runs on your laptop, not the ESP32) ----
; Only the pure-logic modules are compiled here; they must contain no
; Arduino includes.
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<*>
    +<util/>
    +<control/>
    +<calibration/>
    +<config/pin_rules.cpp>
    +<motors/motor_math.cpp>
    +<sensors/slf3s_protocol.cpp>
    +<sensors/mprls_protocol.cpp>
    +<sensors/sim_plant.cpp>
build_flags =
    -std=c++17
    -DUNIT_TEST
    -Wall
    -Wno-unused-parameter
    -Iinclude
